name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  REGISTRY_NAME: mystockstgacr

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set environment from branch
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Deploying to: $ENV"
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get ACR login server
        id: acr
        run: |
          RG_NAME="mystock-${{ steps.set-env.outputs.environment }}-rg"
          ACR_NAME=$(az acr list \
            --resource-group "$RG_NAME" \
            --query "[0].name" \
            --output tsv)
          
          if [ -z "$ACR_NAME" ]; then
            echo "No ACR found, using Docker Hub"
            echo "registry=docker.io" >> $GITHUB_OUTPUT
            echo "username=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
          else
            ACR_LOGIN_SERVER=$(az acr show \
              --name "$ACR_NAME" \
              --query "loginServer" \
              --output tsv)
            echo "registry=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
            echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          fi
      
      - name: Login to Container Registry
        run: |
          if [ -n "${{ steps.acr.outputs.acr_name }}" ]; then
            az acr login --name ${{ steps.acr.outputs.acr_name }}
          else
            echo "No ACR found, skipping login"
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.acr.outputs.registry }}/mystock-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ steps.set-env.outputs.environment }}-latest
            type=raw,value=${{ steps.set-env.outputs.environment }}-${{ github.sha }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=${{ github.sha }}

  deploy:
    name: Deploy to Container Apps
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ needs.build.outputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set Azure Subscription
        run: |
          az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
      
      - name: Get Container App details
        id: containerapp
        run: |
          ENV="${{ steps.set-env.outputs.environment }}"
          RG_NAME="mystock-$ENV-rg"
          
          # Find Container App with pattern: mys{env3char}api*
          ENV_PREFIX=$(echo "$ENV" | cut -c1-3)
          CONTAINERAPP_NAME=$(az containerapp list --resource-group "$RG_NAME" \
            --query "[?starts_with(name, 'mys${ENV_PREFIX}api')].name | [0]" \
            --output tsv)
          
          if [ -z "$CONTAINERAPP_NAME" ]; then
            echo "❌ No Container App found matching pattern: mys${ENV_PREFIX}api*"
            exit 1
          fi
          
          echo "resource_group=$RG_NAME" >> $GITHUB_OUTPUT
          echo "containerapp_name=$CONTAINERAPP_NAME" >> $GITHUB_OUTPUT
          echo "Found Container App: $CONTAINERAPP_NAME in $RG_NAME"
      
      - name: Deploy to Container Apps
        run: |
          RG_NAME="${{ steps.containerapp.outputs.resource_group }}"
          CONTAINERAPP_NAME="${{ steps.containerapp.outputs.containerapp_name }}"
          IMAGE_TAG="${{ needs.build.outputs.image-tag }}"
          
          echo "Deploying $IMAGE_TAG to $CONTAINERAPP_NAME"
          
          az containerapp update \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$RG_NAME" \
            --image "$IMAGE_TAG" \
            --set-env-vars \
              "ENVIRONMENT=${{ steps.set-env.outputs.environment }}" \
              "BUILD_SHA=${{ github.sha }}" \
              "DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      
      - name: Get Container App URL
        id: url
        run: |
          RG_NAME="${{ steps.containerapp.outputs.resource_group }}"
          CONTAINERAPP_NAME="${{ steps.containerapp.outputs.containerapp_name }}"
          
          FQDN=$(az containerapp show \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$RG_NAME" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          echo "Backend URL: https://$FQDN"
      
      - name: Health Check
        run: |
          FQDN="${{ steps.url.outputs.fqdn }}"
          
          echo "Waiting for deployment to stabilize..."
          sleep 30
          
          echo "Performing health check..."
          for i in {1..10}; do
            if curl -f "https://$FQDN/api/v1/health" > /dev/null 2>&1; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          
          echo "❌ Health check failed after 10 attempts"
          exit 1
      
      - name: Deployment Summary
        run: |
          echo "## Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ steps.set-env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Container App**: ${{ steps.containerapp.outputs.containerapp_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image**: ${{ needs.build.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://${{ steps.url.outputs.fqdn }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Backend deployed successfully" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()
    
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get previous revision
        id: previous
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          RG_NAME="mystock-$ENV-rg"
          
          # Find Container App with pattern: mys{env3char}api*
          ENV_PREFIX=$(echo "$ENV" | cut -c1-3)
          CONTAINERAPP_NAME=$(az containerapp list --resource-group "$RG_NAME" \
            --query "[?starts_with(name, 'mys${ENV_PREFIX}api')].name | [0]" \
            --output tsv)
          
          if [ -z "$CONTAINERAPP_NAME" ]; then
            echo "No Container App found for rollback"
            exit 0
          fi
          
          PREVIOUS_REVISION=$(az containerapp revision list \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$RG_NAME" \
            --query "[?properties.active==\`true\`].name | [1]" \
            --output tsv)
          
          echo "previous_revision=$PREVIOUS_REVISION" >> $GITHUB_OUTPUT
      
      - name: Rollback to previous revision
        if: steps.previous.outputs.previous_revision != ''
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          RG_NAME="mystock-$ENV-rg"
          
          # Find Container App with pattern: mys{env3char}api*
          ENV_PREFIX=$(echo "$ENV" | cut -c1-3)
          CONTAINERAPP_NAME=$(az containerapp list --resource-group "$RG_NAME" \
            --query "[?starts_with(name, 'mys${ENV_PREFIX}api')].name | [0]" \
            --output tsv)
          
          PREVIOUS_REVISION="${{ steps.previous.outputs.previous_revision }}"
          
          echo "Rolling back to: $PREVIOUS_REVISION"
          
          az containerapp revision activate \
            --name "$CONTAINERAPP_NAME" \
            --resource-group "$RG_NAME" \
            --revision "$PREVIOUS_REVISION"
          
          echo "❌ Deployment failed - rolled back to previous version" >> $GITHUB_STEP_SUMMARY
